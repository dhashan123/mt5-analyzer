<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice orders - management</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#0c0f14;--panel:#141922;--panel2:#1b212c;--border:#28303d;--text:#e8ebf2;
--dim:#8b95a9;--good:#34c759;--bad:#ff5f56;--warn:#e3a008;--accent:#4c8dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin:12px 0}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.id{font-family:ui-monospace,monospace;font-size:12px;color:var(--accent)}
.status{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--dim)}
.status.paid{background:#1a3a2a;color:var(--good)}
.status.delivered{background:#1a2a3a;color:var(--accent)}
.status.pending{background:#3a2a1a;color:var(--warn)}
.amount{font-weight:600;font-size:15px}
.meta{color:var(--dim);font-size:12.5px;margin-top:4px}
.script{color:#c6ccd9;font-size:13px;margin-top:8px;white-space:pre-wrap;
max-height:120px;overflow:auto;background:var(--panel2);padding:8px 10px;border-radius:6px}
.audio{margin-top:8px}
.audio a{color:var(--accent);font-size:13px}
.empty{color:var(--dim);text-align:center;padding:40px 0}
.token-row{display:flex;gap:8px;margin-bottom:16px}
.token-row input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);
padding:8px 10px;border-radius:6px;font:13px/1.4 monospace}
.token-row button{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.refresh{background:var(--panel2);color:var(--text);border:1px solid var(--border);
padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:12px}
.confirm{margin-top:8px;background:var(--good);color:#06220f;border:0;
padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Voice orders</h1>
  <p class="sub">The orders that have been placed, and where they are in the
  recording and delivery. The token is the one in .secrets/order_token.txt.</p>

  <div class="token-row">
    <input id="token" type="password" placeholder="order token" />
    <button onclick="load()">Load</button>
  </div>
  <button class="refresh" onclick="load()">Refresh</button>
  <div id="err" class="err"></div>
  <div id="list"></div>
</div>

<script>
const SITE = "https://mt5-analyzer.dhashan.workers.dev";
function token() { return document.getElementById("token").value.trim(); }

async function load() {
  const t = token();
  const err = document.getElementById("err");
  const list = document.getElementById("list");
  err.textContent = "";
  if (!t) { err.textContent = "the token is missing"; return; }
  list.innerHTML = '<p class="empty">loading...</p>';
  try {
    const r = await fetch(SITE + "/api/orders", { headers: { "x-order-token": t } });
    if (!r.ok) throw new Error("the site answered " + r.status);
    const data = await r.json();
    const orders = data.orders || [];
    if (!orders.length) {
      list.innerHTML = '<p class="empty">no orders yet</p>';
      return;
    }
    list.innerHTML = orders.map(o => {
      const status = (o.status || "pending").toLowerCase();
      const paid = o.paid ? "paid" : "unpaid";
      const audio = o.audio_url
        ? '<div class="audio"><a href="' + o.audio_url + '" download>download the MP3</a></div>'
        : "";
      const script = o.script ? '<div class="script">' + escapeHtml(o.script) + '</div>' : "";
      const ref = o.tx ? '<div class="meta">reference: ' + escapeHtml(o.tx) + '</div>' : "";
      const canConfirm = !o.paid && (status === "payment_review" || status === "awaiting_payment");
      const confirm = canConfirm
        ? '<button class="confirm" onclick="confirmPaid('' + escapeHtml(o.id) + '')">' +
          'Confirm paid</button>'
        : "";
      return '<div class="card"><div class="row">' +
        '<div><div class="id">' + escapeHtml(o.id) + '</div>' +
        '<div class="amount">' + escapeHtml(o.amount_display || "") + '</div>' +
        '<div class="meta">' + escapeHtml(o.voice || "alder") + " &middot; " +
        (o.words || 0) + " words &middot; " + paid + '</div>' +
        ref + script + audio + '</div>' +
        '<div><span class="status ' + status + '">' + status + '</span>' +
        confirm + '</div>' +
        '</div></div>';
    }).join("");
  } catch (e) {
    list.innerHTML = "";
    err.textContent = "could not load the orders: " + e.message;
  }
}

async function confirmPaid(id) {
  const t = token();
  if (!t) { document.getElementById("err").textContent = "the token is missing"; return; }
  try {
    const r = await fetch(SITE + "/voice-order/" + id + "/confirm", {
      method: "POST",
      headers: { "x-order-token": t }
    });
    if (!r.ok) throw new Error("the site answered " + r.status);
    load();
  } catch (e) {
    document.getElementById("err").textContent = "could not confirm: " + e.message;
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// If the token is in the URL, use it.
const params = new URLSearchParams(location.search);
const t = params.get("token");
if (t) { document.getElementById("token").value = t; load(); }
</script>
</body>
</html>
